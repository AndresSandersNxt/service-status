name: Publiceer statuspagina
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer statusgegevens
        run: node validate.mjs
      - name: Controleer versiegebonden bestanden
        run: node --test build.test.mjs
      - uses: actions/configure-pages@v5
      - name: Verzamel publieke bestanden
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publiceer
        id: deployment
        uses: actions/deploy-pages@v4
